##  lines from the solvated .inpcrd every time they start,  ##
##  because the real box is only known after tLeap.         ##
##  Anything you type here is overwritten.                  ##
#############################################################
set cell_x              140.5672
set cell_y              140.5672
set cell_z              140.5672
set cell_ox             70.2836
set cell_oy             70.2836
set cell_oz             70.2836
set pme_x               144
set pme_y               144
set pme_z               144
