#############################################################
##  UDB v1.0  -  PAMAM G4  -  MASTER MD SETTINGS
#############################################################
##
##  THIS IS THE ONE FILE YOU EDIT.
##
##  Both run paths read it:
##      run_namd.sh   the 5-stage pipeline (01..05_*.conf)
##      run_full.sh   the all-in-one dendrimer_pamam_gen4_full.namd
##
##  It is plain Tcl, which is what NAMD's config parser already
##  speaks -- every .conf file in this folder starts with
##  `source udb_md.conf` and then refers to these variables.
##
##  Change a number here, re-run, done.  No need to regenerate
##  anything from UDB.
##
##  Step counts, not nanoseconds:  ns = steps * timestep_fs / 1e6
##  At 2.0 fs, 1 ns = 500000 steps.
##
#############################################################


# ---- identity ---------------------------------------------------------
set prefix              dendrimer_pamam_gen4

# ---- hardware ---------------------------------------------------------
# 1 = NAMD 3 GPU-resident dynamics (needs a CUDA build + a visible GPU).
#     Both launchers read this and switch their command line to
#     `+p1 +setcpuaffinity +devices 0`, which is what GPU-resident wants.
#     Stage 1 (minimisation) always stays on the multi-core CPU launch.
# 0 = CPU launch, `+pN`.  A CUDA build still offloads nonbonded work.
set gpu                 0

# ---- thermodynamics ---------------------------------------------------
set temperature         300.0   ;# K
set pressure            1.01325 ;# bar (1.01325 = 1 atm)

# ---- solvation --------------------------------------------------------
# Read by udb_solvate.sh, which drives tLeap.  Changing either value here and
# deleting ${prefix}_solvated.* re-solvates the system on the next run -- no
# regeneration from UDB needed.
#
# ion_conc is the salt added ON TOP of neutralising the solute: udb_solvate.sh
# solvates once, counts the waters tLeap actually placed, and adds
#     N = round(ion_conc * n_water / 55.56)
# Na+/Cl- pairs, which is the ionic strength you asked for rather than one
# derived from a box volume guessed before tLeap ran.  0.15 M is physiological.
set ion_conc            0.1500  ;# mol/L NaCl (0 = neutralise only)
set box_pad             15.0    ;# A of TIP3P beyond the solute

# 1 = udb_solvate.sh also converts the solvated prmtop into a CHARMM-format
#     ${prefix}_solvated.psf (+ _psf.pdb) with ParmEd, for VMD and psf-based
#     analysis tools.  The MD runs from the prmtop either way -- every .conf
#     here sets `amber on` and `parmfile`, so this file is output, not input.
set make_psf            1

# ---- stage lengths, in steps ------------------------------------------
set min_steps           2000    ;# minimisation
set heat_steps          100000  ;# 200 ps heat 0 -> $temperature
set nvt_steps           250000  ;# 500 ps NVT equilibration
set npt_restrained      0       ;# 0.00 ns NPT, solute restrained
set npt_free            5000000 ;# 10.00 ns NPT, restraints released
set prod_steps          45000000 ;# 90 ns production

# ---- restraints -------------------------------------------------------
# 0 = stage 4 is ONE free NPT run of $npt_free steps.  Every frame in
#     04_npt_equil.dcd is then unrestrained equilibrium, which is what you want
#     when the equilibration trajectory is going to be analysed: with
#     restraints on, half of that DCD is restrained conformations and half is
#     free, in one file, with nothing marking the boundary.
# 1 = $npt_restrained steps restrained at $restraint_k, then $npt_free free.
#     Both halves still land in the same 04_npt_equil.dcd, so analysis.tcl is
#     generated to read 05_production.dcd only.
# This switch is read at run time, but it can only turn restraints OFF for a
# package generated with them ON -- turning them on needs the constraints block
# in 04_npt_equil.conf, which is written only when the UDB checkbox is ticked.
set use_restraints      0
set restraint_k         1.00    ;# kcal/mol/A^2 on solute heavy atoms

# ---- integrator / nonbonded -------------------------------------------
set timestep_fs         2.0
set rigid_bonds         all     ;# all | water | none
set cutoff              12.0
set switchdist          10.0
set pairlistdist        14.0
set stepspercycle       20
set margin              5.0

# ---- thermostat / barostat --------------------------------------------
set langevin_damping    1.00    ;# 1/ps
set piston_period       200.0   ;# fs
set piston_decay        100.0   ;# fs

# ---- heating ramp -----------------------------------------------------
# The staged 02_heat.conf derives its own reassignment interval and increment
# from $temperature and $heat_steps, so editing either one above still lands on
# the target temperature.  The rule is "never more than 2 K per reassignment";
# $reassign_freq below is only the LONGEST interval it may use.
# $heat_windows is used by the all-in-one script instead, which ramps
# langevinTemp in that many equal blocks.
set reassign_freq       1000
set heat_windows        20

# ---- output frequencies (steps) ---------------------------------------
# Rounded down to a multiple of $stepspercycle at use, so any value is safe.
set energy_freq         500
set restart_freq        10000
# Steps per trajectory frame: one DCD frame is written every $traj_freq steps,
# i.e. every [expr {$traj_freq * $timestep_fs / 1000.0}] ps.
set traj_freq           1000


# ---- helper used by every conf file -----------------------------------
# NAMD requires run lengths and output frequencies to be whole multiples of
# stepspercycle.  This rounds down, with a floor of one cycle, so hand-edited
# numbers above can never produce "must be a multiple of stepsPerCycle".
proc udb_mult {n m} {
    set r [expr {int(double($n) / $m) * $m}]
    if {$r < $m} { set r $m }
    return $r
}

# Output frequency for a stage that is $n steps long.  NAMD only writes a
# .restart.* set when the step counter reaches a multiple of restartfreq, so a
# frequency LONGER than the stage produces no restart files at all -- and since
# each staged .conf is a separate NAMD run that reads the previous stage's
# .restart.coor, the next stage then dies with
#     FATAL ERROR: Unable to open extended system file.
# Minimisation is the usual victim: 2000 steps against a 10000-step
# restart_freq.  Clamping here means any combination of hand-edited numbers in
# this file still yields a runnable pipeline.
proc udb_out {want n m} {
    set f [expr {$want < $n ? $want : $n}]
    return [udb_mult $f $m]
}


