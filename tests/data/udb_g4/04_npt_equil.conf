# ============================================================
# PAMAM G4  Stage 4: NPT Equilibration
# Unrestrained throughout: one free NPT run of $npt_free steps, so every
#   frame in 04_npt_equil.dcd is equilibrium sampling and analysis.tcl reads
#   it together with 05_production.dcd.
# No constraints block is emitted, so no restraint reference PDB is built.
#   To get the restrained phase back, re-generate with the stage-4 restraint
#   box ticked on the NAMD tab -- `use_restraints 1` alone cannot add it.
# Settings come from udb_md.conf -- edit that file, not this one.
source udb_md.conf

amber               on
parmfile            ${prefix}_solvated.prmtop
exclude             scaled1-4
oneFourScaling      1.0
cutoff              $cutoff
switching           on
switchdist          $switchdist
pairlistdist        $pairlistdist
stepspercycle       $stepspercycle
PME                 yes
PMEGridSizeX        $pme_x
PMEGridSizeY        $pme_y
PMEGridSizeZ        $pme_z
wrapAll             on
wrapWater           on
rigidBonds          $rigid_bonds
rigidTolerance      1e-8
timestep            $timestep_fs

# GPU-resident dynamics -- set by `set gpu` in udb_md.conf.
# run_namd.sh reads the same value and matches its command line.
if { $gpu } {
    GPUresident     on
}
ambercoor           ${prefix}_solvated.inpcrd
bincoordinates      03_nvt_equil.restart.coor
binvelocities       03_nvt_equil.restart.vel
extendedSystem      03_nvt_equil.restart.xsc
outputName          04_npt_equil
binaryoutput        yes
binaryrestart       yes
# Clamped against the WHOLE stage, not just its restrained part -- with
# use_restraints 0 that part is zero steps long, and udb_out would floor every
# output frequency to one cycle.
set npt_total       [expr {$npt_restrained + $npt_free}]
outputEnergies      [udb_out $energy_freq $npt_total $stepspercycle]
restartfreq         [udb_out $restart_freq $npt_total $stepspercycle]
dcdfreq             [udb_out $traj_freq $npt_total $stepspercycle]
xstFreq             [udb_out $traj_freq $npt_total $stepspercycle]
langevin            on
langevinDamping     $langevin_damping
langevinTemp        $temperature
langevinHydrogen    off
useGroupPressure    yes
useFlexibleCell     no
useConstantArea     no
langevinPiston          on
langevinPistonTarget    $pressure
langevinPistonPeriod    $piston_period
langevinPistonDecay     $piston_decay
langevinPistonTemp      $temperature
margin              $margin
run                 [udb_mult $npt_free $stepspercycle]
