# ============================================================
# PAMAM G4  Stage 1: Energy Minimisation
# Settings come from udb_md.conf -- edit that file, not this one.
# The cell is auto-patched into udb_md.conf from the inpcrd by run_namd.sh.
# GPUresident is intentionally absent here -- minimisation stays on the
# multi-core CPU launch. Dynamics stages (02-05) honour `set gpu`.
source udb_md.conf

amber               on
parmfile            ${prefix}_solvated.prmtop
exclude             scaled1-4
oneFourScaling      1.0
cutoff              $cutoff
switching           on
switchdist          $switchdist
pairlistdist        $pairlistdist
stepspercycle       $stepspercycle
PME                 yes
PMEGridSizeX        $pme_x
PMEGridSizeY        $pme_y
PMEGridSizeZ        $pme_z
wrapAll             on
wrapWater           on
rigidBonds          $rigid_bonds
rigidTolerance      1e-8
timestep            $timestep_fs

ambercoor           ${prefix}_solvated.inpcrd
outputName          01_minimize
binaryoutput        yes
binaryrestart       yes
outputEnergies      [udb_out $energy_freq $min_steps $stepspercycle]
restartfreq         [udb_out $restart_freq $min_steps $stepspercycle]
dcdfreq             [udb_out $traj_freq $min_steps $stepspercycle]
xstFreq             [udb_out $traj_freq $min_steps $stepspercycle]
cellBasisVector1    $cell_x  0.0      0.0
cellBasisVector2    0.0      $cell_y  0.0
cellBasisVector3    0.0      0.0      $cell_z
cellOrigin          $cell_ox $cell_oy $cell_oz
temperature         0
minimize            [udb_mult $min_steps $stepspercycle]
