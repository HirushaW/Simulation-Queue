# ============================================================
# PAMAM G4  Stage 2: NVT Heating  0 -> T K
# Settings come from udb_md.conf -- edit that file, not this one.
source udb_md.conf

amber               on
parmfile            ${prefix}_solvated.prmtop
exclude             scaled1-4
oneFourScaling      1.0
cutoff              $cutoff
switching           on
switchdist          $switchdist
pairlistdist        $pairlistdist
stepspercycle       $stepspercycle
PME                 yes
PMEGridSizeX        $pme_x
PMEGridSizeY        $pme_y
PMEGridSizeZ        $pme_z
wrapAll             on
wrapWater           on
rigidBonds          $rigid_bonds
rigidTolerance      1e-8
timestep            $timestep_fs

# GPU-resident dynamics -- set by `set gpu` in udb_md.conf.
# run_namd.sh reads the same value and matches its command line.
if { $gpu } {
    GPUresident     on
}
ambercoor           ${prefix}_solvated.inpcrd
bincoordinates      01_minimize.restart.coor
binvelocities       01_minimize.restart.vel
extendedSystem      01_minimize.restart.xsc
outputName          02_heat
binaryoutput        yes
binaryrestart       yes
outputEnergies      [udb_out $energy_freq $heat_steps $stepspercycle]
restartfreq         [udb_out $restart_freq $heat_steps $stepspercycle]
dcdfreq             [udb_out $traj_freq $heat_steps $stepspercycle]
xstFreq             [udb_out $traj_freq $heat_steps $stepspercycle]
langevin            on
langevinDamping     $langevin_damping
langevinTemp        $temperature
langevinHydrogen    off

# The ramp is DERIVED from $temperature and $heat_steps, so editing either one
# in udb_md.conf still lands on the target.  Rule: never jump more than 2 K per
# reassignment (a steeper step heats faster than the thermostat can absorb) --
# if the requested ramp is steeper than that, reassign more OFTEN instead of
# taking bigger steps.  $reassign_freq is the upper bound on the interval.
#
# The old generator hardcoded reassignFreq 1000 and incr = min(2, T/(steps/1000)),
# which for the default 200 ps ramp gave 100 x 2 K = 200 K -- the stage named
# "0 -> 300 K" actually ended at 200 K and left the NVT stage to finish the job.
# Deriving the interval instead makes the ramp reach the temperature it claims,
# and matches what the all-in-one script does.  If the ramp is simply too short
# to get there at 2 K a time, the increment stays capped and reassignHold pins
# whatever is reached -- same safe fallback as before.
set udb_nreassign [expr {int(ceil(double($temperature) / 2.0))}]
set udb_freq      [udb_mult [expr {$heat_steps / $udb_nreassign}] $stepspercycle]
if { $udb_freq > $reassign_freq } { set udb_freq $reassign_freq }
set udb_incr      [expr {double($temperature) * $udb_freq / $heat_steps}]
if { $udb_incr > 2.0 } { set udb_incr 2.0 }
reassignFreq        $udb_freq
reassignTemp        0
reassignIncr        $udb_incr
reassignHold        $temperature
run                 [udb_mult $heat_steps $stepspercycle]
