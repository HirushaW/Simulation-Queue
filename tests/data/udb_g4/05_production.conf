# ============================================================
# PAMAM G4  Stage 5: NPT Production
# Settings come from udb_md.conf -- edit that file, not this one.
source udb_md.conf

amber               on
parmfile            ${prefix}_solvated.prmtop
exclude             scaled1-4
oneFourScaling      1.0
cutoff              $cutoff
switching           on
switchdist          $switchdist
pairlistdist        $pairlistdist
stepspercycle       $stepspercycle
PME                 yes
PMEGridSizeX        $pme_x
PMEGridSizeY        $pme_y
PMEGridSizeZ        $pme_z
wrapAll             on
wrapWater           on
rigidBonds          $rigid_bonds
rigidTolerance      1e-8
timestep            $timestep_fs

# GPU-resident dynamics -- set by `set gpu` in udb_md.conf.
# run_namd.sh reads the same value and matches its command line.
if { $gpu } {
    GPUresident     on
}
ambercoor           ${prefix}_solvated.inpcrd
bincoordinates      04_npt_equil.restart.coor
binvelocities       04_npt_equil.restart.vel
extendedSystem      04_npt_equil.restart.xsc
outputName          05_production
binaryoutput        yes
binaryrestart       yes
outputEnergies      [udb_out $energy_freq $prod_steps $stepspercycle]
restartfreq         [udb_out $restart_freq $prod_steps $stepspercycle]
dcdfreq             [udb_out $traj_freq $prod_steps $stepspercycle]
xstFreq             [udb_out $traj_freq $prod_steps $stepspercycle]
langevin            on
langevinDamping     $langevin_damping
langevinTemp        $temperature
langevinHydrogen    off
useGroupPressure    yes
useFlexibleCell     no
useConstantArea     no
langevinPiston          on
langevinPistonTarget    $pressure
langevinPistonPeriod    $piston_period
langevinPistonDecay     $piston_decay
langevinPistonTemp      $temperature
margin              $margin
run                 [udb_mult $prod_steps $stepspercycle]
